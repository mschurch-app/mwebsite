<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f39">
  <title>M+大雅教會｜網站視覺預覽</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf2ed;color:#173f38;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.preview-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;padding:10px clamp(16px,4vw,48px);background:rgba(255,253,247,.94);border-bottom:1px solid #dce7df;box-shadow:0 8px 24px #173f380d;backdrop-filter:blur(14px)}.identity{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:#17483f;color:white;font-weight:950;font-size:18px;letter-spacing:-.08em}.mark span{color:#f18442}.title{font-size:14px;font-weight:850}.caption{display:block;margin-top:2px;color:#708078;font-size:11px;font-weight:600}.controls{display:flex;align-items:center;gap:8px}.controls button,.open{min-height:38px;padding:0 13px;border:1px solid #dce7df;border-radius:999px;background:#fff;color:#31574d;font:700 12px inherit;cursor:pointer}.controls button[aria-pressed="true"]{background:#17483f;color:#fff;border-color:#17483f}.open{display:inline-flex;align-items:center;text-decoration:none;background:#e66e2e;border-color:#e66e2e;color:white;padding-inline:16px}.stage{display:flex;justify-content:center;padding:22px;min-height:calc(100vh - 68px)}iframe{display:block;width:100%;min-height:calc(100vh - 112px);border:0;border-radius:16px;background:#fff;box-shadow:0 18px 56px #173f381a;transition:width .25s ease}.stage.mobile iframe{width:390px;min-height:820px;border:8px solid #183f38;border-radius:30px}.stage.tablet iframe{width:820px;min-height:calc(100vh - 112px);border:6px solid #183f38;border-radius:22px}@media(max-width:620px){.preview-bar{align-items:flex-start;flex-wrap:wrap;padding:10px 14px}.identity{flex:1}.controls{order:2;width:100%;justify-content:flex-start}.open{margin-left:auto}.stage{padding:10px;min-height:calc(100vh - 112px)}iframe{min-height:calc(100vh - 160px);border-radius:10px}.stage.mobile iframe,.stage.tablet iframe{width:100%;min-height:calc(100vh - 160px)}}
  </style>
<link rel="stylesheet" href="church-palette.css?v=20261003-sunshine3"></head>
<body>
  <header class="preview-bar">
    <div class="identity"><div class="mark">M<span>+</span></div><div><div class="title">M+大雅教會｜網站預覽</div><small class="caption">首頁視覺更新 · 可切換裝置尺寸</small></div></div>
    <div class="controls" aria-label="預覽尺寸">
      <button type="button" data-size="desktop" aria-pressed="true">桌機</button>
      <button type="button" data-size="tablet" aria-pressed="false">平板</button>
      <button type="button" data-size="mobile" aria-pressed="false">手機</button>
    </div>
    <a class="open" href="index.html" target="_blank" rel="noopener">另開首頁 ↗</a>
  </header>
  <main class="stage" id="stage"><iframe src="index.html" title="M+大雅教會首頁預覽"></iframe></main>
  <script>
    const stage=document.querySelector('#stage');
    document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{
      stage.className='stage '+(button.dataset.size==='desktop'?'':button.dataset.size);
      document.querySelectorAll('[data-size]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    }));
  </script>
</body>
</html>
