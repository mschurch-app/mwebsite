<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101716">
  <title>金流驗證｜2027 熱火籃球營</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'Noto Sans TC',system-ui,sans-serif;color:#14231e;background:#f6f4ed}*{box-sizing:border-box}body{margin:0;line-height:1.6}header{height:72px;padding:0 max(20px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between;background:#101716;color:#fff}header a{color:#d8ee43;text-decoration:none;font-weight:800}main{max-width:820px;margin:46px auto 90px;padding:0 20px}h1{font-size:clamp(30px,6vw,46px);line-height:1.2;margin:0 0 12px}h2{font-size:21px;margin:0 0 16px}p{margin:0 0 18px}small,.muted{color:#60716a}.card{background:#fff;border:1px solid #dfe6df;box-shadow:0 18px 45px #18271b10;border-radius:22px;padding:28px;margin:24px 0}.eyebrow{font-size:12px;letter-spacing:.15em;color:#c8482b;font-weight:800}.field{display:grid;gap:7px;margin:18px 0;font-weight:700}input,select{width:100%;border:1px solid #b9c5ba;border-radius:11px;padding:12px 14px;background:#fff;color:#14231e;font:inherit}input:focus,select:focus{outline:2px solid #467463;outline-offset:2px}button{border:0;border-radius:12px;background:#193f37;color:#fff;padding:13px 20px;font:700 16px inherit;cursor:pointer}button:hover{background:#28564b}button:disabled{opacity:.55;cursor:wait}.error{color:#a32618}.notice{background:#eef4ec;border-left:4px solid #467463;border-radius:8px;padding:12px 16px}.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.method{border:1px solid #d4dfd3;border-radius:12px;padding:12px;background:#f7faf6}.method b,.method span{display:block}.method span{font-size:13px;color:#60716a}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:570px}th,td{text-align:left;padding:11px;border-bottom:1px solid #dce4da;font-size:14px}th{color:#60716a}td b{white-space:nowrap}.payment-details{background:#eef4ec;color:#183f35}.payment-details p{margin:2px 0;overflow-wrap:anywhere}.status-paid{color:#22704e}.status-account_issued{color:#92610e}.status-failed{color:#a32618}[hidden]{display:none!important}@media(max-width:600px){main{margin-top:28px}.card{padding:20px}}
  </style>
  <script type="module" src="heat-camp-payment-test.mjs?v=20261014-5"></script>
</head>
<body>
  <header><span>M+ 熱火籃球營・金流驗證</span><a href="heat-camp-2027.html" aria-label="返回報名頁">← 返回</a></header>
  <main>
    <p class="eyebrow">PAYMENT CHECK</p>
    <h1>逐項驗證付款方式</h1>
    <p class="muted">此頁使用正式藍新商店；建立的測試訂單與球員報名、名額、收據分開。實際完成付款才會產生真實交易。</p>
    <section class="card" id="login-section">
      <h2>輸入管理密碼</h2>
      <form id="login-form"><label class="field">金流驗證密碼<input id="password" type="password" autocomplete="off" required></label><button type="submit">進入驗證頁</button></form>
      <p id="login-message" class="error" role="alert" hidden></p>
    </section>
    <div id="dashboard" hidden>
      <section class="card">
        <h2>每種付款方式的最低測試金額</h2>
        <div class="methods" id="method-minimums"></div>
        <p class="notice">信用卡、ATM 虛擬帳號可從 NT$10 測試；超商條碼至少 NT$20。這些是建立測試訂單的最低額；付款仍由你在藍新頁面確認。</p>
      </section>
      <section class="card">
        <h2>建立測試交易</h2>
        <form id="test-form">
          <label class="field">付款方式<select id="method" required><option value="card">信用卡</option><option value="atm">ATM 虛擬帳號</option><option value="barcode">超商條碼</option></select></label>
          <label class="field">測試金額（新台幣）<input id="amount" type="number" inputmode="numeric" step="1" min="10" max="1000" value="10" required></label>
          <label class="field">測試聯絡 Email（交給藍新，本站暫不寄確認信）<input id="email" type="email" autocomplete="email" required></label>
          <p id="amount-note" class="muted"></p>
          <button id="test-submit" type="submit">建立交易並前往藍新</button>
          <p id="test-message" class="error" role="alert" hidden></p>
        </form>
      </section>
      <section class="card">
        <h2>最近交易狀態</h2>
        <p class="muted">「待繳」表示取得帳號或代碼，尚未確認入帳。ATM 與超商實際付款後，請重新整理狀態。「已付款」表示藍新回傳交易成功；教會銀行撥款仍需另行對帳。</p>
        <button id="refresh" type="button">重新查詢狀態</button>
        <div class="table-wrap"><table><thead><tr><th>建立時間</th><th>方式</th><th>金額</th><th>交易單號</th><th>狀態</th></tr></thead><tbody id="orders"></tbody></table></div>
      </section>
    </div>
  </main>
</body>
</html>
