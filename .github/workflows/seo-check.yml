name: 檢查公開頁面 SEO
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 檢查講道來源與重複顯示
        run: |
          python qa/sermon-source.py
          node qa/sermon-dedup.mjs
      - name: 核對靜態頁面與內容來源同步
        run: |
          node scripts/build-seo.mjs
          git diff --exit-code -- index.html sermons.html sitemap.xml about*.html
      - name: 核對搜尋標記與公開連結
        run: node scripts/check-seo.mjs
